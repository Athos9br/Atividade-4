<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Contatos</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <div class="cabecalho">
            <h1>📒 Cadastro de Contatos</h1>
            <p>Cadastre, visualize e mantenha seus contatos salvos no navegador.</p>
        </div>
    </header>

    <main>
        <section class="formulario-area">
            <h2>Novo contato</h2>

            <form id="formulario">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite o nome" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="Digite o telefone" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite o e-mail" required>
                </div>

                <button type="submit">➕ Cadastrar contato</button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="lista-area">
            <div class="titulo-lista">
                <div>
                    <h2>Contatos cadastrados</h2>
                    <p id="quantidade">Nenhum contato cadastrado.</p>
                </div>

                <button id="limpar" class="botao-limpar" type="button">
                    🗑️ Limpar registros
                </button>
            </div>

            <div id="listaContatos" class="lista-contatos"></div>
        </section>
    </main>

    <footer>
        <p>Mini-sistema de cadastro • JavaScript + Objetos + Arrays + JSON + localStorage</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
